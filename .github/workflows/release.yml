name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:bin
      - name: Package macOS and Linux archives
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "pkg/$t" && cp "release/brolog-$t" "pkg/$t/brolog"
            tar -C "pkg/$t" -czf "release/brolog-$t.tar.gz" brolog
          done
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
